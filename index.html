  <body class="bg-[#faf8ff] text-[#0f172a] select-none antialiased overflow-x-hidden">
    <div id="root"></div>
    <script>
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            if (name !== 'bluelogic-v5.3') {
              caches.delete(name);
            }
          }
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
